<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>Karaoke Maleta — Cantor</title>
<link rel="manifest" href="/karaoke-maleta-pwa/singer/manifest.webmanifest">
<style>html,body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}#boot b{color:#ffd21f;font-size:24px}#boot small{display:block;color:#aaa;margin-top:10px}</style>
</head><body><div id="boot"><div><b>KARAOKÊ MALETA</b><small id="bootMsg">Conectando à maleta…</small></div></div>
<script>
const ROLE='singer',KEY='karaokeMaletaLocalEndpoint';
function norm(v){v=String(v||'').trim().replace(/\/$/,'');if(!v)return '';if(!/^https?:\/\//i.test(v))v='http://'+v;return v}
const qs=new URLSearchParams(location.search);
const fromQr=norm(qs.get('local'));
if(fromQr)localStorage.setItem(KEY,fromQr);
const local=fromQr||norm(localStorage.getItem(KEY)||'');
if(local){
  const target=local+'/'+ROLE+'/';
  document.getElementById('bootMsg').textContent='Abrindo o Karaoke Maleta no notebook…';
  setTimeout(()=>location.replace(target),80);
}else{
  document.getElementById('bootMsg').textContent='Leia novamente o QR Code exibido no Karaoke Maleta.';
}
</script></body></html>
