<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Karaoke Maleta — Admin</title>
<link rel="manifest" href="manifest.webmanifest?v=020">
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.load{width:min(430px,90vw);text-align:center}.logo{font-size:31px;font-weight:1000;color:#ffd21f;margin-bottom:10px}.msg{color:#aaa;line-height:1.5}.err{color:#ff7d7d;white-space:pre-wrap}.spin{width:38px;height:38px;border:4px solid #332b19;border-top-color:#ffd21f;border-radius:50%;margin:22px auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="load"><div class="logo">KARAOKÊ MALETA</div><div class="spin"></div><div id="msg" class="msg">Conectando ao Karaoke Maleta…</div></div>
<script>
const KM_KEY='karaokeMaletaLocalEndpoint';
const qs=new URLSearchParams(location.search);
let endpoint=String(qs.get('local')||localStorage.getItem(KM_KEY)||'').trim().replace(/\/$/,'');
if(endpoint&&!/^https?:\/\//i.test(endpoint))endpoint='http://'+endpoint;
if(qs.get('local')){localStorage.setItem(KM_KEY,endpoint);qs.delete('local');history.replaceState({},'',location.pathname+(qs.toString()?'?'+qs:'')+location.hash)}
const msg=document.getElementById('msg');
const nativeFetch=window.fetch.bind(window);
function localUrl(path){return endpoint+path}
function lna(input,init={}){return nativeFetch(input,{...init,mode:'cors',cache:'no-store',targetAddressSpace:'local'})}
window.fetch=function(input,init={}){
  if(typeof input==='string'&&(input.startsWith('/api/')||input.startsWith('/media/'))) input=localUrl(input);
  if(typeof input==='string'&&endpoint&&input.startsWith(endpoint)) return lna(input,init);
  return nativeFetch(input,init);
};
async function text(path){const r=await lna(localUrl(path));if(!r.ok)throw new Error(path+' → HTTP '+r.status);return r.text()}
async function blobUrl(path){const r=await lna(localUrl(path));if(!r.ok)throw new Error(path+' → HTTP '+r.status);return URL.createObjectURL(await r.blob())}
async function boot(){
  if(!endpoint){msg.innerHTML='Abra este aplicativo pelo <b>QR Code Admin</b> mostrado no Karaoke Maleta no notebook.';document.querySelector('.spin').style.display='none';return}
  try{
    msg.textContent='Carregando o PWA Admin original…';
    const [html,css,js,logo,bg]=await Promise.all([
      text('/admin/index.html'),text('/admin/admin.css'),text('/admin/admin.js'),
      blobUrl('/assets/karaoke_maleta_logo.png'),blobUrl('/assets/maletaoke_brand_full.png')
    ]);
    const bm=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);if(!bm)throw new Error('HTML local inválido');
    let body=bm[1].replace(/<script[\s\S]*?<\/script>/gi,'');
    body=body.replace(/src=["']assets\/karaoke_maleta_logo\.png["']/gi,'src="'+logo+'"');
    const localCss=css.replace(/url\(["']?assets\/maletaoke_brand_full\.png["']?\)/gi,'url("'+bg+'")');
    document.head.insertAdjacentHTML('beforeend','<style>'+localCss+'</style>');
    document.body.innerHTML=body;
    let localJs=js.replace(/navigator\.serviceWorker\.register\(["']\/admin\/sw\.js["']\)/g,"navigator.serviceWorker.register('/karaoke-maleta-pwa/admin/sw.js')");
    const s=document.createElement('script');s.textContent=localJs;document.body.appendChild(s);
  }catch(e){
    console.error(e);document.querySelector('.spin')?.remove();msg.className='msg err';msg.textContent='Não foi possível conectar ao notebook.\n\n'+(e?.message||e)+'\n\nConfira se o celular está na mesma rede/Hotspot e se o Karaoke Maleta está aberto.';
  }
}
boot();
</script>
</body>
</html>
