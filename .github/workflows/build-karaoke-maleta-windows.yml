name: Build Karaoke Maleta Windows

on:
  push:
    branches:
      - desktop-v0.10.35-build
    paths:
      - 'desktop-build/TRIGGER'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download finalized source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b8dc-820e-a6e4-ade744b43ec6/raw?se=2026-09-19T03%3A04%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=3f764509-8830-50ee-a3ea-fbcb67690ab2&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A31%3A25Z&ske=2026-09-19T20%3A31%3A25Z&sks=b&skv=2026-02-06&sig=oYwZFgPePzQ8FPr7uvz4NRuU9dNtx25ofOQF3v6P/7E%3D' -OutFile 'buildfinal.zip'
          Expand-Archive -Path 'buildfinal.zip' -DestinationPath '.' -Force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: buildfinal
        run: npm install

      - name: Build Windows installer
        working-directory: buildfinal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Maleta-Windows-v0.10.35-final
          path: buildfinal/dist/Karaoke_Maleta_Setup_0.10.35.exe
          if-no-files-found: error
