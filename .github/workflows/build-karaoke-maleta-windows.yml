name: Build Karaoke Maleta Dual Windows

on:
  push:
    branches:
      - desktop-v0.10.35-build
    paths:
      - 'desktop-build/DUAL'

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download previous working installers
        uses: actions/download-artifact@v4
        with:
          name: Karaoke-Maleta-v0.10.36-Licenciado-e-Livre
          path: previous
          repository: Jefferson8149/karaoke-maleta-pwa
          run-id: 35418400305
          github-token: ${{ github.token }}

      - name: Recover application source from previous installer
        shell: pwsh
        run: |
          $installer = (Get-ChildItem 'previous' -Recurse -Filter 'Karaoke_Maleta_Licenciado_Setup_0.10.36.exe' | Select-Object -First 1).FullName
          if(-not $installer){ throw 'Instalador base não encontrado.' }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'installed-base'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Start-Process -FilePath $installer -ArgumentList '/S',("/D="+$dest) -Wait
          $asar = Join-Path $dest 'resources\app.asar'
          if(-not (Test-Path $asar)){ throw 'app.asar não encontrado após instalar base.' }
          npx --yes @electron/asar extract $asar recovered
          New-Item -ItemType Directory -Force -Path 'dual\licensed','dual\free' | Out-Null
          Copy-Item 'recovered\*' 'dual\licensed' -Recurse -Force
          Copy-Item 'recovered\*' 'dual\free' -Recurse -Force
          node desktop-build/make-dual.js dual
          node --check dual/licensed/main.js
          node --check dual/free/main.js

      - name: Install licensed dependencies
        working-directory: dual/licensed
        run: npm install

      - name: Build licensed installer
        working-directory: dual/licensed
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Install free dependencies
        working-directory: dual/free
        run: npm install

      - name: Build free installer
        working-directory: dual/free
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload corrected installers
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Maleta-v0.10.36-Corrigida
          path: |
            dual/licensed/dist/Karaoke_Maleta_Licenciado_Setup_0.10.36.exe
            dual/free/dist/Karaoke_Maleta_Livre_Setup_0.10.36.exe
          if-no-files-found: error
